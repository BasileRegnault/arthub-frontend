<div class="relative w-full">
  <input type="text"
         [formControl]="inputControl"
         (focus)="showDropdown.set(true); onTouched()"
         placeholder="Rechercher un artiste..."
         class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500" />

  <!-- Spinner -->
  <div *ngIf="loading()" class="absolute inset-y-0 right-3 flex items-center">
    <svg class="animate-spin h-5 w-5 text-blue-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
      <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
      <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4l3-3-3-3v4a12 12 0 00-12 12h4z"></path>
    </svg>
  </div>

  <!-- Dropdown -->
  <div *ngIf="showDropdown() && results().length"
       class="absolute z-20 mt-1 w-full bg-white border border-gray-200 rounded-lg shadow-lg max-h-56 overflow-auto">
    <div *ngFor="let artist of results()"
         class="px-4 py-2 cursor-pointer hover:bg-blue-50"
         (mousedown)="selectArtist(artist)">
      {{ artist.firstname }} {{ artist.lastname }}
    </div>
  </div>

  <!-- Aucun résultat -->
  <p *ngIf="showDropdown() && !results().length && !loading()"
     class="text-sm text-gray-500 mt-1">
    Aucun artiste trouvé.
  </p>
</div>
