<div class="min-h-screen flex items-center justify-center bg-gray-100">
  <form
    [formGroup]="form"
    (ngSubmit)="submit()"
    class="bg-white p-8 rounded-xl shadow w-full max-w-md space-y-4"
  >
    <app-back-button label="Retour"></app-back-button>

    <h1 class="text-2xl font-bold text-center">Mot de passe oublié</h1>

    <input
      type="email"
      formControlName="email"
      placeholder="Votre email"
      class="w-full px-4 py-2 border rounded"
    />

    <p *ngIf="success" class="text-green-600 text-sm text-center">
      Si un compte existe, un email a été envoyé.
    </p>

    <button
      type="submit"
      [disabled]="loading"
      class="w-full bg-black text-white py-2 rounded"
    >
      Envoyer
    </button>
  </form>
</div>
