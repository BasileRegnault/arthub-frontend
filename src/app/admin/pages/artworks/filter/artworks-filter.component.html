<div class="bg-gray-50 border border-gray-200 rounded-xl shadow-sm p-4 md:p-6 space-y-4">

  <!-- Header -->
  <div class="flex justify-between items-center mb-2">
    <h3 class="text-lg font-semibold text-gray-700">Filtres</h3>
    <span class="text-sm text-gray-400 hidden md:inline">Recherche avancée</span>
  </div>

  <!-- Formulaire -->
  <form [formGroup]="form" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-3 md:gap-4">

    <!-- Titre -->
    <input
      type="text"
      formControlName="title"
      placeholder="Titre"
      class="border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 w-full"
    />

    <!-- Artiste -->
    <app-artist-autocomplete
      formControlName="artist"
      class="w-full">
    </app-artist-autocomplete>

    <!-- Type -->
    <select formControlName="type" class="border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 w-full">
      <option value="">Tous les types</option>
      <option *ngFor="let t of types" [value]="t">{{ t }}</option>
    </select>

    <!-- Style -->
    <select formControlName="style" class="border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 w-full">
      <option value="">Tous les styles</option>
      <option *ngFor="let s of styles" [value]="s">{{ s }}</option>
    </select>

    <!-- Localisation / Pays -->
    <input
      type="text"
      formControlName="location"
      placeholder="Pays / Localisation"
      class="border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 w-full"
    />

    <!-- Dates -->
    <input
      type="date"
      formControlName="fromDate"
      placeholder="Date début"
      class="border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 w-full"
    />
    <input
      type="date"
      formControlName="toDate"
      placeholder="Date fin"
      class="border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 w-full"
    />

    <!-- Affichage toggle -->
    <div class="flex items-center gap-2 md:col-span-4 mt-2">
      <span class="text-sm font-medium text-gray-700">Affichage :</span>

      <div class="flex rounded-lg border overflow-hidden shadow-sm">
        <button type="button"
                class="px-3 py-2 text-sm sm:px-4 sm:py-2"
                [class.bg-gray-100]="form.value.isDisplay === ''"
                (click)="setIsDisplay('')">
          Tous
        </button>
        <button type="button"
                class="px-3 py-2 text-sm sm:px-4 sm:py-2"
                [class.bg-green-500]="form.value.isDisplay === true"
                [class.text-white]="form.value.isDisplay === true"
                (click)="setIsDisplay(true)">
          Affiché
        </button>
        <button type="button"
                class="px-3 py-2 text-sm sm:px-4 sm:py-2"
                [class.bg-red-500]="form.value.isDisplay === false"
                [class.text-white]="form.value.isDisplay === false"
                (click)="setIsDisplay(false)">
          Masqué
        </button>
      </div>
    </div>

  </form>

  <!-- Actions -->
  <div class="flex justify-end gap-3 pt-3 border-t">
    <button
      type="button"
      (click)="resetFilters()"
      class="px-4 py-2 rounded-lg border text-gray-600 hover:bg-gray-50 transition">
      Réinitialiser
    </button>

    <button
      type="button"
      (click)="submit()"
      class="px-5 py-2 rounded-lg bg-blue-600 text-white hover:bg-blue-700 transition">
      Rechercher
    </button>
  </div>

</div>
