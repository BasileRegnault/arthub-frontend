<div class="bg-gray-50 border border-gray-200 rounded-xl shadow-sm p-4 md:p-6 space-y-4">

  <div class="flex justify-between items-center mb-2">
    <h3 class="text-lg font-semibold text-gray-700">Filtres</h3>
    <span class="text-sm text-gray-400 hidden md:inline">Recherche avancée</span>
  </div>

  <form [formGroup]="form" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-3 md:gap-4">

    <input type="text" formControlName="firstname" placeholder="Prénom" class="border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 w-full"/>
    <input type="text" formControlName="lastname" placeholder="Nom" class="border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 w-full"/>
    <input type="text" formControlName="nationality" placeholder="Nationalité" class="border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 w-full"/>
    <input type="date" formControlName="bornAtFrom" placeholder="Né après" class="border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 w-full"/>
    <input type="date" formControlName="bornAtTo" placeholder="Né avant" class="border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 w-full"/>
    <input type="date" formControlName="diedAtFrom" placeholder="Décédé après" class="border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 w-full"/>
    <input type="date" formControlName="diedAtTo" placeholder="Décédé avant" class="border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 w-full"/>

  </form>

  <div class="flex justify-end gap-3 pt-3 border-t">
    <button type="button" (click)="resetFilters()" class="px-4 py-2 rounded-lg border text-gray-600 hover:bg-gray-50">Réinitialiser</button>
    <button type="button" (click)="submit()" class="px-5 py-2 rounded-lg bg-blue-600 text-white hover:bg-blue-700">Rechercher</button>
  </div>

</div>
